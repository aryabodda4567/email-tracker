<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Email Sender</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
        }

        input,
        textarea,
        button {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
        }

        textarea {
            height: 200px;
            font-family: monospace;
            white-space: pre-wrap;
            /* preserve formatting */
        }

        pre {
            background: #f4f4f4;
            padding: 10px;
            margin-top: 20px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <h2>Email Tracker Client</h2>

    <label>Email:</label>
    <input type="email" id="email" placeholder="Enter recipient email" required>

    <label>Subject:</label>
    <input type="text" id="subject" placeholder="Enter subject" required>

    <label>HTML Body:</label>
    <textarea id="htmlBody" placeholder="Enter email body exactly as you want it sent..."></textarea>

    <button onclick="sendEmail()">Send Email</button>

    <pre id="response"></pre>

    <script>
        function sendEmail() {

            const email = document.getElementById("email").value;
            const subject = document.getElementById("subject").value;
            const htmlBody = document.getElementById("htmlBody").value;
            // Preserves all spaces and newlines

            const myHeaders = new Headers();
            myHeaders.append("Content-Type", "application/json");

            const raw = JSON.stringify({
                email: email,
                subject: subject,
                htmlBody: htmlBody
            });

            const requestOptions = {
                method: "POST",
                headers: myHeaders,
                body: raw,
                redirect: "follow"
            };

            fetch("https://email-tracker-jade.vercel.app/send-email", requestOptions)
                .then((response) => response.text())
                .then((result) => {
                    document.getElementById("response").textContent = result;
                })
                .catch((error) => {
                    document.getElementById("response").textContent = error;
                });
        }
    </script>

</body>

</html>
