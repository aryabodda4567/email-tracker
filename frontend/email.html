<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Email Tracker Client</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
        }

        textarea {
            width: 100%;
            height: 200px;
            font-family: monospace;
            white-space: pre-wrap;
            /* preserves formatting */
        }

        input,
        button {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
        }

        #response {
            margin-top: 20px;
            padding: 10px;
            background: #f4f4f4;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <h2>Email Sender (Tracking Enabled)</h2>

    <form id="emailForm">
        <label>Email:</label>
        <input type="email" id="email" required>

        <label>Subject:</label>
        <input type="text" id="subject" required>

        <label>HTML Body:</label>
        <textarea id="htmlBody" placeholder="Enter your email content exactly as you want it sent..."
            required></textarea>

        <button type="submit">Send Email</button>
    </form>

    <div id="response"></div>

    <script>
        const form = document.getElementById("emailForm");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const email = document.getElementById("email").value;
            const subject = document.getElementById("subject").value;
            const htmlBody = document.getElementById("htmlBody").value;

            try {
                const res = await fetch("https://email-tracker-jade.vercel.app/send-email", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email,
                        subject,
                        htmlBody  // sent exactly as entered
                    })
                });

                const data = await res.json();

                document.getElementById("response").innerText =
                    JSON.stringify(data, null, 2);

            } catch (err) {
                document.getElementById("response").innerText =
                    "Error: " + err.message;
            }
        });
    </script>

</body>

</html>
